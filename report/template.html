<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>하나사인몰 일일 매출 리포트</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2a4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="하나매출">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta http-equiv="Cache-Control" content="no-store">
<style>
  :root{--bg:#eef1f5;--card:#fff;--ink:#1a1d21;--sub:#6b7280;--line:#e7eaee;--navy:#1b2a4a;--blue:#2f6df0;--teal:#18b39a;--up:#e0413a;--down:#1e7d4f;--chip:#f1f4f8;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  body{font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:14px;padding-bottom:48px;}
  .topbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;}
  .brand{font-size:16px;font-weight:800;}
  .brand span{font-weight:500;color:var(--sub);font-size:11px;letter-spacing:1px;margin-left:6px;}
  .synced{font-size:11px;color:var(--sub);margin-top:2px;}
  .datebar{display:flex;align-items:center;gap:6px;margin-top:8px;}
  .datebar button{flex:0 0 auto;width:36px;height:38px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:17px;color:var(--blue);font-weight:700;}
  .datebar #refresh{background:var(--blue);color:#fff;border:none;}
  .datebar input[type=date]{flex:1;height:38px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font-size:14px;}
  .wrap{max-width:720px;margin:0 auto;padding:12px;}
  .hero{background:var(--navy);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px;}
  .hero .d{font-size:12px;opacity:.8;}
  .hero .big{font-size:30px;font-weight:800;letter-spacing:-1px;margin:2px 0;}
  .hero .meta{font-size:12px;opacity:.85;}
  .badges{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .badge{background:rgba(255,255,255,.12);border-radius:10px;padding:8px 10px;font-size:12px;}
  .badge b{font-size:15px;display:block;margin-top:2px;}
  .bup{color:#ff8a84;} .bdown{color:#8ff0c8;}
  .hbar{display:flex;height:8px;border-radius:6px;overflow:hidden;margin-top:12px;background:rgba(255,255,255,.15);}
  .hbar i{display:block;height:100%;}
  .hbar .hq{background:#5b8def;} .hbar .op{background:var(--teal);}
  .hleg{display:flex;justify-content:space-between;font-size:11.5px;margin-top:6px;opacity:.9;}
  .prevline{text-align:center;color:var(--sub);font-size:11.5px;margin:-2px 0 12px;}
  section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  h2{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;}
  h2 .sum{font-size:11.5px;color:var(--sub);font-weight:500;}
  .donutwrap{display:flex;align-items:center;gap:14px;}
  .pillcol{flex:1;display:flex;flex-direction:column;gap:8px;}
  .pill{border-radius:12px;padding:10px 12px;color:#fff;}
  .pill.hq{background:var(--blue);} .pill.op{background:var(--teal);}
  .pill .t{font-size:11px;opacity:.9;} .pill .v{font-size:17px;font-weight:800;margin-top:2px;} .pill .c{font-size:11px;opacity:.9;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:6px 6px;text-align:right;border-bottom:1px solid var(--line);}
  th:first-child,td:first-child{text-align:left;}
  thead th{color:var(--sub);font-weight:600;font-size:11.5px;}
  tr:last-child td{border-bottom:none;}
  .rank{display:inline-block;width:16px;color:var(--sub);}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .barrow{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px;}
  .barrow .nm{width:96px;flex:0 0 auto;text-align:right;color:#333;}
  .barrow .bo{flex:1;background:#eef1f6;border-radius:5px;height:14px;overflow:hidden;}
  .barrow .bi{height:100%;background:var(--navy);border-radius:5px;}
  .barrow .vv{width:64px;flex:0 0 auto;color:var(--sub);font-size:11px;}
  .wsum{display:flex;gap:10px;margin-bottom:10px;}
  .wsum .b{flex:1;background:var(--chip);border-radius:12px;padding:10px;text-align:center;}
  .wsum .b .t{font-size:11px;color:var(--sub);} .wsum .b .v{font-size:17px;font-weight:800;margin-top:2px;}
  .note{font-size:11px;color:var(--sub);}
  .empty{text-align:center;color:var(--sub);padding:40px 10px;}
  footer{text-align:center;color:var(--sub);font-size:10.5px;margin:16px 0 4px;padding:0 10px;}
  .qbtns{display:flex;gap:8px;margin-top:10px;}
  .qbtn{flex:1;border:none;border-radius:10px;padding:11px 8px;color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;}
  .qbtn.hq{background:var(--blue);} .qbtn.op{background:var(--teal);}
  .qbtn b{font-weight:800;}
  .qmodal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;}
  .qsheet{background:#fff;width:100%;max-width:720px;max-height:86vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;animation:qup .2s ease;}
  @keyframes qup{from{transform:translateY(30px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
  .qhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);background:#fff;border-radius:16px 16px 0 0;}
  .qhead .qt{font-size:15px;font-weight:800;} .qhead .qm{font-size:11.5px;color:var(--sub);font-weight:500;margin-top:2px;}
  .qhead button{border:none;background:var(--chip);width:30px;height:30px;border-radius:8px;font-size:15px;color:var(--sub);flex:0 0 auto;}
  .qbody{overflow-y:auto;padding:6px 14px 24px;-webkit-overflow-scrolling:touch;}
  .qrow{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);}
  .qrow:last-child{border-bottom:none;}
  .qprog{display:inline-block;background:var(--chip);color:#33415a;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;margin-right:6px;}
  .qname{font-size:13px;font-weight:600;}
  .qsub2{color:var(--sub);font-size:11px;margin:3px 0 0 26px;line-height:1.35;}
  .qamt{flex:0 0 auto;font-weight:800;white-space:nowrap;font-size:13.5px;}
  .qrk{display:inline-block;width:22px;color:var(--sub);font-size:11px;}
.qsz{background:#f6f8fc;border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:6px 2px 10px;}
  .qszh{font-size:12px;font-weight:800;color:#33415a;margin-bottom:7px;display:flex;gap:6px;align-items:baseline;}
  .qszh span{font-size:10.5px;color:var(--sub);font-weight:500;}
  .qszbody{display:flex;flex-wrap:wrap;gap:6px;}
  .qchip{background:#fff;border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:12px;color:#1a1d21;}
  .qchip b{color:var(--blue);font-weight:800;margin-left:3px;}
  .qszn{font-size:10.5px;color:var(--sub);margin-top:7px;}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">하나사인몰 일일 매출 리포트 <span>HANA SIGNMALL</span></div>
  <div class="synced" id="synced"></div>
  <div class="datebar">
    <button id="prev" aria-label="이전일">&lsaquo;</button>
    <input type="date" id="picker">
    <button id="next" aria-label="다음일">&rsaquo;</button>
    <button id="refresh" aria-label="새로고침">&#x21bb;</button>
  </div>
</div>
<div class="wrap" id="content"><div class="empty">불러오는 중…</div></div>
<div id="qmodal" class="qmodal" style="display:none" onclick="if(event.target===this)closeQ()">
  <div class="qsheet">
    <div class="qhead"><div><div class="qt" id="qttl"></div><div class="qm" id="qsub"></div></div><button onclick="closeQ()" aria-label="닫기">✕</button></div>
    <div class="qbody" id="qbody"></div>
  </div>
</div>
<footer>업체현황 시트 연동 · 본사(사인몰 진행자)/오픈마켓(채널) 기준 · 미정·금액미확정 건 제외 · 품목 분류는 키워드 추정</footer>
<script>
var EMBED = __DATA__;
var DB = EMBED.data || {};
var DATES = Object.keys(DB).sort();
var LIVE_URL="https://script.google.com/macros/s/AKfycbwcUiCMsG-c0L2RbShk010tqQXD-XxIfEz4vmxR5rRt_QMkMOmHCEQXTUUTcpLctp28yg/exec";
var LIVE_BUSY=false;
function liveSync(dstr,cb){
  if(!dstr){ if(cb)cb(false); return; }
  if(LIVE_BUSY){ if(cb)cb(false); return; }
  LIVE_BUSY=true;
  var s=document.getElementById('synced'), prev=s?s.textContent:'';
  if(s) s.textContent='🔄 실시간 동기화 중…';
  var cbn='__live'+Date.now();
  function cleanup(){ try{delete window[cbn];}catch(e){window[cbn]=undefined;} var el=document.getElementById(cbn); if(el&&el.parentNode) el.parentNode.removeChild(el); }
  var tm=setTimeout(function(){ cleanup(); LIVE_BUSY=false; if(s)s.textContent=prev; if(cb)cb(false); },30000);
  window[cbn]=function(j){
    clearTimeout(tm); cleanup(); LIVE_BUSY=false;
    try{
      if(j&&j.data){
        for(var k in j.data){ DB[k]=j.data[k]; if(DATES.indexOf(k)<0) DATES.push(k); }
        DATES.sort();
        if(j.orders){ if(!QCACHE) QCACHE={}; for(var k2 in j.orders) QCACHE[k2]=j.orders[k2]; }
        if(j.generated) EMBED.generated=j.generated; if(s){ var _n=new Date(), _p=function(x){return (x<10?'0':'')+x;}; s.textContent='🔄 마지막 동기화: '+_n.getFullYear()+'-'+_p(_n.getMonth()+1)+'-'+_p(_n.getDate())+' '+_p(_n.getHours())+':'+_p(_n.getMinutes())+' (실시간)'; }
      }
      if(cb) cb(true);
    }catch(e){ if(cb) cb(false); }
  };
  var sc=document.createElement('script'); sc.id=cbn;
  sc.onerror=function(){ clearTimeout(tm); cleanup(); LIVE_BUSY=false; if(s)s.textContent=prev; if(cb)cb(false); };
  sc.src=LIVE_URL+'?date='+encodeURIComponent(dstr)+'&callback='+cbn+'&t='+Date.now();
  document.body.appendChild(sc);
}
var won = function(n){ return (n||0).toLocaleString('ko-KR'); };
function pctTxt(c,p){ if(!p) return null; return (c-p)/p*100; }
function badge(label,c,p){
  var v=pctTxt(c,p);
  if(v===null) return '<div class="badge">'+label+'<b>–</b></div>';
  var arr=v>0?'▲':(v<0?'▼':'■'), cls=v>0?'bup':(v<0?'bdown':'');
  return '<div class="badge">'+label+'<b class="'+cls+'">'+arr+Math.abs(v).toFixed(1)+'%</b></div>';
}
function prevDateOf(d){ var p=null; for(var i=0;i<DATES.length;i++){ if(DATES[i]<d) p=DATES[i]; else break; } return p; }
function iso(dt){ return dt.toISOString().slice(0,10); }
function weekRange(dstr){
  function fmt(d){ var y=d.getFullYear(),m=d.getMonth()+1,da=d.getDate(); return y+'-'+(m<10?'0':'')+m+'-'+(da<10?'0':'')+da; }
  var dt=new Date(dstr+'T00:00:00'); var day=dt.getDay();
  var diff=(day===0?-6:1-day); var mon=new Date(dt); mon.setDate(dt.getDate()+diff);
  var fri=new Date(mon); fri.setDate(mon.getDate()+4); return [fmt(mon),fmt(fri)];
}
function donut(frac){
  var C=2*Math.PI*54, hq=frac*C;
  return '<svg width="116" height="116" viewBox="0 0 120 120">'
    +'<circle cx="60" cy="60" r="54" fill="none" stroke="#18b39a" stroke-width="16"/>'
    +'<circle cx="60" cy="60" r="54" fill="none" stroke="#2f6df0" stroke-width="16" stroke-dasharray="'+hq+' '+(C-hq)+'" stroke-dashoffset="'+(C*0.25)+'" transform="rotate(-90 60 60)" stroke-linecap="butt"/>'
    +'<text x="60" y="56" text-anchor="middle" font-size="11" fill="#6b7280">본사비중</text>'
    +'<text x="60" y="74" text-anchor="middle" font-size="20" font-weight="800" fill="#1b2a4a">'+Math.round(frac*100)+'%</text></svg>';
}
function rankList(obj){
  var e=Object.entries(obj).sort(function(a,b){return b[1][0]-a[1][0];});
  if(!e.length) return '<div class="note">데이터 없음</div>';
  var h='<table><tbody>';
  for(var i=0;i<e.length;i++){ h+='<tr><td><span class="rank">'+(i+1)+'</span>'+e[i][0]+'</td><td>'+won(e[i][1][0])+'</td><td style="color:var(--sub);font-size:11px">'+e[i][1][1]+'건</td></tr>'; }
  return h+'</tbody></table>';
}
function catTotTable(obj){
  var e=Object.entries(obj).sort(function(a,b){return b[1][1]-a[1][1];});
  if(!e.length) return '<div class="note">데이터 없음</div>';
  var h='<table><thead><tr><th>분류</th><th>품목수</th><th>수량</th></tr></thead><tbody>';
  for(var i=0;i<e.length;i++){ h+='<tr><td>'+e[i][0]+'</td><td>'+e[i][1][0]+'</td><td>'+won(e[i][1][1])+'</td></tr>'; }
  return h+'</tbody></table>';
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function top5Section(arr){
  if(!arr||!arr.length) return '';
  var h='<section><h2>\uC624\uB298 \uB9E4\uCD9C TOP 5 <span class="sum">\uAC74\uBCC4 \uC0C1\uD638\u00B7\uD488\uBA85</span></h2><table><tbody>';
  for(var i=0;i<arr.length;i++){ var t=arr[i];
    h+='<tr><td><span class="rank">'+(i+1)+'</span><b>'+esc(t[1])+'</b>'
      +'<div style="color:var(--sub);font-size:11px;font-weight:400;margin:2px 0 0 16px;line-height:1.35">'+esc(t[3])+' \u00B7 '+esc(t[2])+'</div></td>'
      +'<td style="vertical-align:top;font-weight:700;white-space:nowrap">'+won(t[0])+'\uC6D0</td></tr>'; }
  return h+'</tbody></table></section>';
}
function isoL(dt){ var y=dt.getFullYear(),m=dt.getMonth()+1,d=dt.getDate(); return y+'-'+(m<10?'0':'')+m+'-'+(d<10?'0':'')+d; }
function ymOf(d){ return d.slice(0,7); }
function monLabel(m){ var p=m.split('-'); return (+p[0])+'년 '+(+p[1])+'월'; }
function mondayOf2(dstr){ var dt=new Date(dstr+'T00:00:00'); var day=dt.getDay(); var diff=(day===0?-6:1-day); var mo=new Date(dt); mo.setDate(dt.getDate()+diff); return isoL(mo); }
function monthLastDay(m){ var p=m.split('-'); var d=new Date(+p[0],+p[1],0); return isoL(d); }
function monthlySection(dstr){
  var curM=ymOf(dstr), WD=['일','월','화','수','목','금','토'];
  var M={}; for(var i=0;i<DATES.length;i++){ var dk=DATES[i],r=DB[dk],m=ymOf(dk); if(!M[m])M[m]=[0,0]; M[m][0]+=r.total; M[m][1]+=r.cnt; }
  var curY=curM.slice(0,4);
  var months=Object.keys(M).filter(function(m){return m.slice(0,4)===curY;}).sort();
  if(!months.length) months=Object.keys(M).sort();
  var h='<section><h2>월 매출 <span class="sum">'+curY+'년 · 월별 합계</span></h2><table><thead><tr><th>월</th><th>매출액</th><th>건수</th><th>건당평균</th></tr></thead><tbody>';
  for(var i=0;i<months.length;i++){ var m=months[i],v=M[m],aov=v[1]?Math.round(v[0]/v[1]):0; var hi=(m===curM)?' style="background:#eef3ff;font-weight:800"':'';
    h+='<tr'+hi+'><td>'+monLabel(m)+(m===curM?' <span style="color:var(--sub);font-size:10px">(선택월)</span>':'')+'</td><td>'+won(v[0])+'원</td><td>'+v[1]+'건</td><td>'+won(aov)+'원</td></tr>'; }
  var yT=0,yC=0; for(var i=0;i<months.length;i++){ yT+=M[months[i]][0]; yC+=M[months[i]][1]; }
  h+='<tr style="background:#1b2a4a;color:#fff;font-weight:800"><td>'+curY+'년 매출 합계</td><td>'+won(yT)+'원</td><td>'+yC+'건</td><td>'+(yC?won(Math.round(yT/yC)):0)+'원</td></tr>';
  h+='</tbody></table>';
  var mFirst=curM+'-01', mLast=monthLastDay(curM);
  var W={}; for(var i=0;i<DATES.length;i++){ var dk=DATES[i]; if(ymOf(dk)!==curM) continue; var mo=mondayOf2(dk); if(!W[mo])W[mo]=[0,0]; var r=DB[dk]; W[mo][0]+=r.total; W[mo][1]+=r.cnt; }
  var wks=Object.keys(W).sort(), mtot=0,mcnt=0;
  h+='<h2 style="margin-top:16px">'+monLabel(curM)+' 주간 매출 <span class="sum">월~일</span></h2><table><thead><tr><th>주</th><th>기간</th><th>매출액</th><th>건수</th></tr></thead><tbody>';
  for(var i=0;i<wks.length;i++){ var mo=wks[i]; var su=new Date(mo+'T00:00:00'); su.setDate(su.getDate()+6); var suI=isoL(su);
    var s=(mo<mFirst?mFirst:mo), e=(suI>mLast?mLast:suI); mtot+=W[mo][0]; mcnt+=W[mo][1];
    h+='<tr><td>'+(i+1)+'주</td><td>'+s.slice(5).replace('-','/')+'~'+e.slice(5).replace('-','/')+'</td><td>'+won(W[mo][0])+'원</td><td>'+W[mo][1]+'건</td></tr>'; }
  h+='<tr style="background:#1b2a4a;color:#fff;font-weight:800"><td>'+monLabel(curM)+' 합계</td><td></td><td>'+won(mtot)+'원</td><td>'+mcnt+'건</td></tr></tbody></table>';
  var ords=[]; for(var i=0;i<DATES.length;i++){ var dk=DATES[i]; if(ymOf(dk)!==curM) continue; var t5=DB[dk].top5; if(t5&&t5.length){ for(var j=0;j<t5.length;j++) ords.push(t5[j]); } }
  h+='<h2 style="margin-top:16px">'+monLabel(curM)+' 최고 매출 건 TOP 5 <span class="sum">건별 · 담당자·제목·품목</span></h2><table><tbody>';
  if(ords.length){ ords.sort(function(a,b){return b[0]-a[0];}); ords=ords.slice(0,5);
    for(var i=0;i<ords.length;i++){ var t=ords[i];
      h+='<tr><td><span class="rank">'+(i+1)+'</span><b>'+esc(t[1]||'(제목미기재)')+'</b><div style="color:var(--sub);font-size:11px;font-weight:400;margin:2px 0 0 16px;line-height:1.35">'+esc(t[3])+' \u00B7 '+esc(t[2])+'</div></td><td style="vertical-align:top;font-weight:700;white-space:nowrap">'+won(t[0])+'원</td></tr>'; }
  } else {
    var days=[]; for(var i=0;i<DATES.length;i++){ var dk=DATES[i]; if(ymOf(dk)===curM) days.push([dk,DB[dk].total]); }
    days.sort(function(a,b){return b[1]-a[1];}); days=days.slice(0,5);
    for(var i=0;i<days.length;i++){ h+='<tr><td><span class="rank">'+(i+1)+'</span>'+days[i][0].slice(5).replace('-','/')+'</td><td>'+won(days[i][1])+'원</td></tr>'; }
  }
  h+='</tbody></table></section>';
  return h;
}

var QCACHE=null,QLOAD=false,QWANT=null;
function extractSizes(name){
  var out=[],m;
  m=name.match(/\d{2,5}\s*[*xX\u00d7]\s*\d{2,5}/g);
  if(m)for(var i=0;i<m.length;i++)out.push(m[i].replace(/\s+/g,'').replace(/[xX\u00d7]/g,'*'));
  m=name.match(/[\u00d8\u00f8\u03a6]\s*\d{2,4}/g);
  if(m)for(var i=0;i<m.length;i++)out.push(m[i].replace(/\s+/g,''));
  m=name.match(/\bA[0-9]\b/g);
  if(m)for(var i=0;i<m.length;i++)out.push(m[i]);
  return out;
}
function renderQ(dstr,hq){
  var arr=(QCACHE&&QCACHE[dstr])?QCACHE[dstr]:null;
  var body=document.getElementById('qbody'),ttl=document.getElementById('qttl'),sub=document.getElementById('qsub');
  ttl.textContent=(hq?'사인몰(본사) 견적':'오픈마켓 주문');
  if(arr===null){ sub.textContent=''; body.innerHTML='<div class="empty">이 날짜의 상세 내역은 보관되어 있지 않습니다.</div>'; return; }
  var list=arr.filter(function(o){return o[4]===(hq?1:0);});
  var tot=0; for(var i=0;i<list.length;i++) tot+=list[i][0];
  sub.textContent=dstr.replace(/-/g,'.').replace(/^20/,'')+' · '+list.length+'건 · 합계 '+won(tot)+'원';
  if(!list.length){ body.innerHTML='<div class="empty">해당 내역이 없습니다.</div>'; return; }
  var sz={},nosz=0;
  for(var i=0;i<list.length;i++){ var ss=extractSizes(list[i][2]); if(!ss.length){nosz++;continue;} for(var k=0;k<ss.length;k++) sz[ss[k]]=(sz[ss[k]]||0)+1; }
  var se=Object.keys(sz).map(function(k){return [k,sz[k]];}).sort(function(a,b){return b[1]-a[1];});
  var h='';
  if(se.length){ h+='<div class="qsz"><div class="qszh">📐 많이 나간 사이즈 <span>상품명 기준 · 이 날짜</span></div><div class="qszbody">';
    for(var i=0;i<Math.min(se.length,12);i++){ h+='<span class="qchip">'+esc(se[i][0])+'<b>'+se[i][1]+'</b></span>'; }
    h+='</div>'+(nosz?'<div class="qszn">사이즈 미표기 '+nosz+'건 제외</div>':'')+'</div>'; }
  for(var i=0;i<list.length;i++){ var o=list[i];
    h+='<div class="qrow"><div><span class="qrk">'+(i+1)+'</span><span class="qprog">'+esc(o[3])+'</span><span class="qname">'+esc(o[2])+'</span>'
      +(o[1]?'<div class="qsub2">'+esc(o[1])+'</div>':'')+'</div>'
      +'<div class="qamt">'+won(o[0])+'원</div></div>'; }
  body.innerHTML=h;
}
function openQ(hq){
  document.getElementById('qmodal').style.display='flex';
  document.getElementById('qttl').textContent=(hq?'사인몰(본사) 견적':'오픈마켓 주문');
  document.getElementById('qsub').textContent='';
  QWANT={d:window.CUR,hq:hq};
  if(QCACHE){ renderQ(window.CUR,hq); return; }
  document.getElementById('qbody').innerHTML='<div class="empty">불러오는 중…</div>';
  if(QLOAD) return; QLOAD=true;
  fetch('orders.json?v='+encodeURIComponent(EMBED.generated||'')).then(function(r){return r.json();}).then(function(j){
    QCACHE=j.data||j; QLOAD=false; if(QWANT) renderQ(QWANT.d,QWANT.hq);
  }).catch(function(){ QLOAD=false; document.getElementById('qbody').innerHTML='<div class="empty">견적 데이터를 불러오지 못했습니다.</div>'; });
}
function closeQ(){ document.getElementById('qmodal').style.display='none'; }
function render(dstr){
  var c=document.getElementById('content'), rec=DB[dstr];
  window.CUR=dstr;
  if(!rec){ c.innerHTML='<div class="empty">선택한 날짜의 매출 데이터가 없습니다.</div>'; return; }
  var pd=prevDateOf(dstr), pr=pd?DB[pd]:null;
  var aov=rec.cnt?Math.round(rec.total/rec.cnt):0;
  var hqr=rec.total?Math.round(rec.hq_total/rec.total*100):0, opr=100-hqr;
  var dd=new Date(dstr+'T00:00:00'); var wd=['일','월','화','수','목','금','토'][dd.getDay()];
  var dlabel=dstr.replace(/-/g,'.').replace(/^20/,'')+' ('+wd+')';
  var h='';
  h+='<div class="hero"><div class="d">오늘 총매출 · '+dlabel+'</div><div class="big">'+won(rec.total)+'원</div>';
  h+='<div class="meta">총 '+rec.cnt+'건 · 건당 '+won(aov)+'원 · 제외 '+rec.excl+'건</div>';
  h+='<div class="badges">'+badge('전일대비 매출',rec.total,pr&&pr.total)+badge('전일대비 건수',rec.cnt,pr&&pr.cnt)
     +'<div class="badge">본사<b>'+won(rec.hq_total)+'</b></div><div class="badge">오픈마켓<b>'+won(rec.op_total)+'</b></div></div>';
  h+='<div class="qbtns"><button class="qbtn hq" onclick="openQ(1)">📋 사인몰 견적 <b>'+rec.hq_cnt+'건</b></button><button class="qbtn op" onclick="openQ(0)">📋 오픈마켓 주문 <b>'+rec.op_cnt+'건</b></button></div>';
  h+='<div class="hbar"><i class="hq" style="width:'+hqr+'%"></i><i class="op" style="width:'+opr+'%"></i></div>';
  h+='<div class="hleg"><span>● 본사 '+won(rec.hq_total)+' ('+rec.hq_cnt+'건·'+hqr+'%)</span><span>오픈마켓 '+won(rec.op_total)+' ('+rec.op_cnt+'건·'+opr+'%) ●</span></div></div>';
  if(pr) h+='<div class="prevline">전일('+pd.replace(/-/g,'.').replace(/^20/,'')+'): '+won(pr.total)+'원 · '+pr.cnt+'건 → 오늘 '+won(rec.total)+'원 · '+rec.cnt+'건</div>';
  h+=monthlySection(dstr);
  h+=top5Section(rec.top5);
  // donut
  h+='<section><h2>본사 · 오픈마켓</h2><div class="donutwrap">'+donut(rec.total?rec.hq_total/rec.total:0)
     +'<div class="pillcol"><div class="pill hq"><div class="t">본사(진행자)</div><div class="v">'+won(rec.hq_total)+'</div><div class="c">'+rec.hq_cnt+'건 · 비중 '+hqr+'%</div></div>'
     +'<div class="pill op"><div class="t">오픈마켓(채널)</div><div class="v">'+won(rec.op_total)+'</div><div class="c">'+rec.op_cnt+'건 · 비중 '+opr+'%</div></div></div></div></section>';
  // ranked lists
  h+='<section class="cols" style="display:grid"><div><h2>본사 진행자별 <span class="sum">'+rec.hq_cnt+'건</span></h2>'+rankList(rec.hq)+'</div>'
     +'<div><h2>오픈마켓 채널별 <span class="sum">'+rec.op_cnt+'건</span></h2>'+rankList(rec.op)+'</div></section>';
  // category TOP bar (by sales)
  var its=Object.entries(rec.items).sort(function(a,b){return b[1][0]-a[1][0];}).slice(0,8);
  var mx=its.length?its[0][1][0]:1;
  var bar='<section><h2>품목 카테고리 TOP <span class="sum">매출순</span></h2>';
  for(var i=0;i<its.length;i++){ bar+='<div class="barrow"><div class="nm">'+its[i][0]+'</div><div class="bo"><div class="bi" style="width:'+(its[i][1][0]/mx*100)+'%"></div></div><div class="vv">'+won(its[i][1][0])+'</div></div>'; }
  bar+='</section>'; h+=bar;
  // category totals split
  h+='<section><h2>품목 카테고리별 합계 <span class="sum">품목수 · 수량</span></h2><div class="cols">'
     +'<div><div class="note" style="margin-bottom:6px">본사(내부)</div>'+catTotTable(rec.items_hq)+'</div>'
     +'<div><div class="note" style="margin-bottom:6px">오픈마켓</div>'+catTotTable(rec.items_op)+'</div></div></section>';
  // weekly cumulative (Mon-Fri of selected date's week)
  var wr=weekRange(dstr), wtot=0,wcnt=0,witems={};
  for(var i=0;i<DATES.length;i++){ var dk=DATES[i]; if(dk>=wr[0]&&dk<=wr[1]){ var rr=DB[dk]; wtot+=rr.total; wcnt+=rr.cnt;
    for(var k in rr.items){ if(!witems[k]) witems[k]=[0,0]; witems[k][0]+=rr.items[k][0]; witems[k][1]+=rr.items[k][1]; } } }
  var we=Object.entries(witems).sort(function(a,b){return b[1][1]-a[1][1];});
  var wk='<section><h2>이번 주 누적 (월~금) <span class="sum">'+wr[0].slice(5).replace('-','/')+' ~ '+wr[1].slice(5).replace('-','/')+'</span></h2>';
  wk+='<div class="wsum"><div class="b"><div class="t">주간 누적매출</div><div class="v">'+won(wtot)+'원</div></div><div class="b"><div class="t">주간 누적건수</div><div class="v">'+wcnt+'건</div></div></div>';
  wk+='<table><thead><tr><th>품목 (많이 팔린 순)</th><th>누적건수</th><th>누적매출</th></tr></thead><tbody>';
  for(var i=0;i<we.length;i++){ wk+='<tr><td><span class="rank">'+(i+1)+'</span>'+we[i][0]+'</td><td>'+we[i][1][1]+'건</td><td>'+won(we[i][1][0])+'</td></tr>'; }
  wk+='</tbody></table></section>'; h+=wk;
  c.innerHTML=h;
}
function setDate(d){ document.getElementById('picker').value=d; render(d); liveSync(d,function(ok){ if(ok&&window.CUR===d) render(d); }); }
function step(dir){ var cur=document.getElementById('picker').value,t=null,i;
  if(dir<0){ for(i=0;i<DATES.length;i++){ if(DATES[i]<cur) t=DATES[i]; else break; } }
  else { for(i=0;i<DATES.length;i++){ if(DATES[i]>cur){ t=DATES[i]; break; } } }
  if(t) setDate(t);
}
(function(){
  try{
    var g=EMBED.generated||"";
    if(g) document.getElementById('synced').textContent='🔄 마지막 동기화: '+g+' (KST)';
    var today=new Date().toISOString().slice(0,10);
    var def=null; for(var i=0;i<DATES.length;i++){ if(DATES[i]<=today) def=DATES[i]; }
    if(!def) def=DATES[DATES.length-1];
    var p=document.getElementById('picker'); p.min=DATES[0]; p.max=def;
    p.addEventListener('change',function(e){ render(e.target.value); });
    document.getElementById('prev').onclick=function(){ step(-1); };
    document.getElementById('next').onclick=function(){ step(1); };
    document.getElementById('refresh').onclick=function(){ var d=window.CUR||document.getElementById('picker').value; liveSync(d,function(ok){ render(d); if(!ok){ location.href=location.pathname+'?t='+Date.now(); } }); };
    setDate(def);
  }catch(err){ document.getElementById('content').innerHTML='<div class="empty">오류: '+err.message+'</div>'; }
})();
</script>
</body>
</html>
